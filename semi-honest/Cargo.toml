[package]
name = "Ladon"
version = "0.1.0"
edition = "2024"

# =============================================================================
# Dependencies
# =============================================================================
[dependencies]
# Core crypto + bit-level serialization
bitvec   = "1.0.1"
rand     = "0.8.5"
sha3     = "0.10.8"


# =============================================================================
# Benches — each file lives at benches/<name>.rs and has its own fn main().
# harness = false tells cargo not to inject the default #[test] harness.
# Run individually with:  cargo bench --bench <name>
# Or all at once with:    cargo bench
# =============================================================================

[[bench]]
name    = "bench_keygen_sharing"
harness = false

[[bench]]
name    = "bench_encapsulation"
harness = false

[[bench]]
name    = "bench_committee_local"
harness = false

[[bench]]
name    = "bench_tee"
harness = false

[[bench]]
name    = "net"
harness = false